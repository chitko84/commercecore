# Production profile. No defaults for secrets/connection details --
# every value below MUST come from the environment. Missing env vars
# fail application startup rather than silently falling back to a
# dev-friendly default.

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${SMTP_HOST}
    port: ${SMTP_PORT}
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

app:
  email:
    mode: smtp
    from: ${EMAIL_FROM}
    frontend-base-url: ${FRONTEND_BASE_URL}

management:
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    com.commercecore: INFO

# Interactive API documentation is intentionally a development-only surface.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
