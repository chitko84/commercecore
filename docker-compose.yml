services:
  postgres:
    image: postgres:16-alpine
    container_name: commercecore-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-commercecore}
      POSTGRES_USER: ${DB_USERNAME:-commercecore}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
    ports: ["${DB_PORT:-5432}:5432"]
    volumes: [commercecore-postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-commercecore} -d ${DB_NAME:-commercecore}"]
      interval: 5s
      timeout: 5s
      retries: 20

  notification-postgres:
    image: postgres:16-alpine
    container_name: commercecore-notification-postgres
    environment:
      POSTGRES_DB: ${NOTIFICATION_DB_NAME:-notifications}
      POSTGRES_USER: ${NOTIFICATION_DB_USERNAME:-notification}
      POSTGRES_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?NOTIFICATION_DB_PASSWORD must be set}
    ports: ["${NOTIFICATION_DB_PORT:-5433}:5432"]
    volumes: [notification-postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${NOTIFICATION_DB_USERNAME:-notification} -d ${NOTIFICATION_DB_NAME:-notifications}"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka:
    image: apache/kafka:3.9.1
    container_name: commercecore-kafka
    ports: ["${KAFKA_PORT:-9092}:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,PLAINTEXT_HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20

  redis:
    image: redis:7.4-alpine
    container_name: commercecore-redis
    ports: ["${REDIS_PORT:-6379}:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [commercecore-redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  commercecore-core:
    build: .
    container_name: commercecore-core
    environment:
      APP_MAIN: com.commercecore.CommerceCoreApplication
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-commercecore}
      DB_USERNAME: ${DB_USERNAME:-commercecore}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SIGNING_SECRET: ${JWT_SIGNING_SECRET}
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      REDIS_HOST: redis
      REDIS_PORT: 6379
      EVENTS_ENABLED: "true"
      ASYNC_NOTIFICATIONS: "true"
      CATALOG_CACHE_ENABLED: "true"
      APP_DEMO_SEED: ${APP_DEMO_SEED:-false}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:3000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    ports: ["${CORE_PORT:-8082}:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 30

  notification-service:
    build: .
    container_name: commercecore-notification-service
    environment:
      APP_MAIN: com.commerceplatform.notification.NotificationServiceApplication
      NOTIFICATION_DB_URL: jdbc:postgresql://notification-postgres:5432/${NOTIFICATION_DB_NAME:-notifications}
      NOTIFICATION_DB_USERNAME: ${NOTIFICATION_DB_USERNAME:-notification}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
      JWT_SIGNING_SECRET: ${JWT_SIGNING_SECRET}
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    ports: ["${NOTIFICATION_PORT:-8081}:8081"]
    depends_on:
      notification-postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health/readiness | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 30

  api-gateway:
    build: .
    container_name: commercecore-api-gateway
    environment:
      APP_MAIN: com.commerceplatform.gateway.ApiGatewayApplication
      GATEWAY_CORE_URL: http://commercecore-core:8080
      GATEWAY_NOTIFICATION_URL: http://notification-service:8081
    ports: ["${GATEWAY_PORT:-8080}:8080"]
    depends_on:
      commercecore-core: { condition: service_healthy }
      notification-service: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/liveness | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 20

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: commercecore-prometheus
    ports: ["${PROMETHEUS_PORT:-9090}:9090"]
    volumes: [./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro]
    depends_on:
      api-gateway: { condition: service_healthy }

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api/v1
    container_name: commercecore-frontend
    ports: ["${FRONTEND_PORT:-3000}:80"]
    depends_on:
      api-gateway: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  commercecore-postgres-data:
  notification-postgres-data:
  commercecore-redis-data:
