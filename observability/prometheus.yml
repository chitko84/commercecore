global:
  scrape_interval: 10s
scrape_configs:
  - job_name: commercecore-core
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ['commercecore-core:8080'] }]
  - job_name: notification-service
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ['notification-service:8081'] }]
  - job_name: api-gateway
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ['api-gateway:8080'] }]
